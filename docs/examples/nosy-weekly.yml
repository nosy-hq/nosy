# .github/workflows/nosy.yml — Nosy's weekly, model-free loop. No model key needed, no charge.
# First, once, locally: `npx github:nosy-hq/nosy setup .` → commit pm/sources.json.
name: Nosy
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read           # change to write if you set commit: "true" or roadmap: "true" below
  pull-requests: read      # change to write if you set roadmap: "true" (it opens or updates one PR)
  issues: read

jobs:
  nosy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # peek reads git history
      - uses: nosy-hq/nosy@main
        with:
          slack-webhook: ${{ secrets.NOSY_SLACK_WEBHOOK }}      # optional
          discord-webhook: ${{ secrets.NOSY_DISCORD_WEBHOOK }}  # optional
          commit: "false"   # "true" makes the Action commit pm/state/ and pm/page.html and push them. pm/state/ can hold issue and PR text.
          roadmap: "false"  # "true" proposes ROADMAP.md as a pull request each week (updates the open one). Needs pm/sources.json "roadmap": {}, permissions contents: write + pull-requests: write, and the repo setting that lets Actions create pull requests.
